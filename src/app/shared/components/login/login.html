<div class="flex min-h-screen items-center justify-center bg-gray-50 px-6 py-12">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">

    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-gray-900">
        Welcome Back
      </h1>

      <p class="mt-2 text-sm text-gray-500">
        Sign in to access Attribute Management.
      </p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-5">

      <!-- Username -->
      <div>
        <label
          for="username"
          class="mb-2 block text-sm font-semibold text-gray-700"
        >
          Username
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          #usernameField="ngModel"
          placeholder="Enter your username"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
        />

        @if (usernameField.invalid && usernameField.touched) {
          <p class="mt-1 text-xs text-red-600">
            Username is required.
          </p>
        }
      </div>

      <!-- Password -->
      <div>
        <label
          for="password"
          class="mb-2 block text-sm font-semibold text-gray-700"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          #passwordField="ngModel"
          placeholder="Enter your password"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
        />

        @if (passwordField.invalid && passwordField.touched) {
          <p class="mt-1 text-xs text-red-600">
            Password is required.
          </p>
        }
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Login
      </button>

    </form>

    <p class="mt-6 text-center text-xs text-gray-400">
      Demo authentication — no backend connected.
    </p>

  </div>
</div>
