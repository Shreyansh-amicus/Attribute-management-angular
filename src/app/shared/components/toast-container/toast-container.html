<div class="fixed right-4 top-4 z-100 flex w-full max-w-sm flex-col gap-3">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-center justify-between gap-4 rounded-lg border p-4 shadow-lg"
      [class.border-red-300]="toast.type === 'error'"
      [class.bg-red-50]="toast.type === 'error'"
      [class.text-red-800]="toast.type === 'error'"
      [class.border-green-300]="toast.type === 'success'"
      [class.bg-green-50]="toast.type === 'success'"
      [class.text-green-800]="toast.type === 'success'"
      [class.border-blue-300]="toast.type === 'info'"
      [class.bg-blue-50]="toast.type === 'info'"
      [class.text-blue-800]="toast.type === 'info'"
      role="alert"
    >
      <p class="text-sm font-medium">
        {{ toast.message }}
      </p>

      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 text-lg font-bold opacity-60 hover:opacity-100"
        aria-label="Dismiss notification"
      >
        &times;
      </button>
    </div>
  }
</div>
